name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the web build was verified with; its emdawnwebgpu port is what
  # web/webgpu_workarounds.js works around, so update the two together.
  EMSCRIPTEN_VERSION: 7.0.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # shaderc pulls in glslang, SPIRV-Tools and Tint and takes a while to
      # build, so keep the native build directory between runs. On an exact
      # hit the cached shaderc is used as is.
      - name: Cache native shaderc build
        id: shaderc-cache
        uses: actions/cache@v4
        with:
          path: build
          key: shaderc-make-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: shaderc-make-${{ runner.os }}-

      # No apt: the runners often cannot reach any Ubuntu mirror. bgfx's CMake
      # requires X11 and OpenGL on Linux, but only the bgfx library and the
      # desktop app use them; shaderc links neither. Placeholder paths satisfy
      # those checks, and only shaderc is built. The default generator (make)
      # avoids needing ninja.
      - name: Build native shaderc
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        run: |
          placeholders="$RUNNER_TEMP/x11-gl-placeholders"
          mkdir -p "$placeholders/include"
          touch "$placeholders/libplaceholder.so"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBGFX_WITH_WAYLAND=OFF \
            -DX11_X11_INCLUDE_PATH="$placeholders/include" \
            -DX11_X11_LIB="$placeholders/libplaceholder.so" \
            -DOPENGL_INCLUDE_DIR="$placeholders/include" \
            -DOPENGL_opengl_LIBRARY="$placeholders/libplaceholder.so" \
            -DOPENGL_glx_LIBRARY="$placeholders/libplaceholder.so"
          cmake --build build --target shaderc --parallel "$(nproc)"

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten SDK
        timeout-minutes: 15
        run: |
          if [ ! -d emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"

      - name: Build web
        run: |
          source emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release \
            -DRESTIR_HOST_SHADERC="$PWD/build/_deps/bgfx.cmake-build/cmake/bgfx/shaderc"
          cmake --build build-web --parallel "$(nproc)"

      - name: Assemble site
        run: |
          mkdir -p site
          cp build-web/restir_gi.js build-web/restir_gi.wasm build-web/restir_gi.data site/
          cp build-web/restir_gi.html site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
