name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the web build was verified with; its emdawnwebgpu port is what
  # web/webgpu_workarounds.js works around, so update the two together.
  EMSCRIPTEN_VERSION: 7.0.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # shaderc pulls in glslang, SPIRV-Tools and Tint and takes a while to
      # build, so keep the native build directory between runs. On an exact
      # hit the cached shaderc is used as is, and the native packages and
      # build below are skipped.
      - name: Cache native shaderc build
        id: shaderc-cache
        uses: actions/cache@v4
        with:
          path: build
          key: shaderc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: shaderc-${{ runner.os }}-

      # The runner's Ubuntu mirrors sometimes fail to resolve, and apt then
      # retries each package for minutes. Skip apt when the packages are
      # already installed, otherwise retry with short timeouts.
      - name: Install native build dependencies
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          packages="ninja-build libx11-dev libgl-dev libwayland-dev"
          if dpkg -s $packages >/dev/null 2>&1; then
            echo "All packages are already installed."
            exit 0
          fi
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3 4; do
            if sudo apt-get $apt_options update -q && \
               sudo apt-get $apt_options install -y -q --no-install-recommends $packages; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying in $((attempt * 15)) s."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build native shaderc
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target shaderc

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten SDK
        timeout-minutes: 15
        run: |
          if [ ! -d emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"

      - name: Build web
        run: |
          source emsdk/emsdk_env.sh
          # Default generator: on a shaderc cache hit, ninja is not installed.
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release \
            -DRESTIR_HOST_SHADERC="$PWD/build/_deps/bgfx.cmake-build/cmake/bgfx/shaderc"
          cmake --build build-web --parallel "$(nproc)"

      - name: Assemble site
        run: |
          mkdir -p site
          cp build-web/restir_gi.js build-web/restir_gi.wasm build-web/restir_gi.data site/
          cp build-web/restir_gi.html site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
